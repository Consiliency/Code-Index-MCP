# localci-workflow-classification: manual-only
name: Sign Published Image

# Retroactively cosign-sign an already-published GHCR image (keyless, via the
# Actions OIDC identity). Signing cannot be done off-CI because keyless cosign
# needs the workflow's id-token. Used for images published before signing moved
# into the release job; safe to re-run (cosign sign is idempotent per digest).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sign a published image or attest a locally prepared index digest.'
        required: true
        type: choice
        default: image
        options: [image, index-attestation]
      version:
        description: 'Published tag to sign (e.g., v1.4.0). Its source must be on protected-main history.'
        required: false
        type: string
      expected_digest:
        description: 'Immutable image digest recorded in the published release asset.'
        required: false
        type: string
      expected_source_sha:
        description: 'Protected-main commit that produced the published image.'
        required: false
        type: string
      expected_source_tree:
        description: 'Git tree of the protected-main commit.'
        required: false
        type: string
      subject_digest:
        description: 'Canonical artifact-metadata.json SHA-256; never source or index contents.'
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  sign-published-image:
    name: Sign an already-published container image
    runs-on: ubuntu-latest
    if: inputs.mode == 'image' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Derive lowercase GHCR image name (follows repo owner across transfers)
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_NAME=${owner}/code-index-mcp" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${REGISTRY}/${owner}/code-index-mcp" >> "$GITHUB_ENV"

      - name: Check out exact protected-main commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Guard protected main before signing container images
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_SOURCE_TREE: ${{ inputs.expected_source_tree }}
        run: |
          VERSION_NO_V=${RELEASE_VERSION#v}
          test -n "$VERSION_NO_V"
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git merge-base --is-ancestor "${{ github.sha }}" origin/main
          git merge-base --is-ancestor "$EXPECTED_SOURCE_SHA" "${{ github.sha }}"
          test "$(git rev-parse "${RELEASE_VERSION}^{commit}")" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse "${EXPECTED_SOURCE_SHA}^{tree}")" = "$EXPECTED_SOURCE_TREE"
          git show "${EXPECTED_SOURCE_SHA}:pyproject.toml" | grep -Fxq "version = \"$VERSION_NO_V\""
          git show "${EXPECTED_SOURCE_SHA}:mcp_server/__init__.py" | grep -Fxq "__version__ = \"$VERSION_NO_V\""

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard protected main before signing container images
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_SOURCE_TREE: ${{ inputs.expected_source_tree }}
        run: |
          VERSION_NO_V=${RELEASE_VERSION#v}
          test -n "$VERSION_NO_V"
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git merge-base --is-ancestor "${{ github.sha }}" origin/main
          git merge-base --is-ancestor "$EXPECTED_SOURCE_SHA" "${{ github.sha }}"
          test "$(git rev-parse "${RELEASE_VERSION}^{commit}")" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse "${EXPECTED_SOURCE_SHA}^{tree}")" = "$EXPECTED_SOURCE_TREE"
          git show "${EXPECTED_SOURCE_SHA}:pyproject.toml" | grep -Fxq "version = \"$VERSION_NO_V\""
          git show "${EXPECTED_SOURCE_SHA}:mcp_server/__init__.py" | grep -Fxq "__version__ = \"$VERSION_NO_V\""

      - name: Sign the published container image (keyless)
        env:
          REF_NAME: ${{ inputs.version }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh release download "$REF_NAME" --pattern image-digest.txt --dir "$RUNNER_TEMP"
          test "$(cat "$RUNNER_TEMP/image-digest.txt")" = "$EXPECTED_DIGEST"
          TAG_DIGEST=$(docker buildx imagetools inspect \
            "${IMAGE}:${REF_NAME}" --format '{{.Manifest.Digest}}')
          test "$TAG_DIGEST" = "$EXPECTED_DIGEST"
          docker pull "${IMAGE}@${EXPECTED_DIGEST}"
          test "$(docker image inspect "${IMAGE}@${EXPECTED_DIGEST}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$EXPECTED_SOURCE_SHA"
          cosign sign --yes "${IMAGE}@${EXPECTED_DIGEST}"

  attest-local-index:
    name: Attest operator-supplied local index digest
    if: inputs.mode == 'index-attestation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Validate digest-only input
        env:
          SUBJECT_DIGEST: ${{ inputs.subject_digest }}
        run: |
          [[ "$SUBJECT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || exit 1
      - name: Attest local digest without claiming a hosted build
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: index-it-mcp-artifact-metadata.json
          subject-digest: sha256:${{ inputs.subject_digest }}
          predicate-type: https://github.com/Consiliency/Code-Index-MCP/local-index-digest/v1
          predicate: '{"artifact_origin":"local","digest_origin":"operator-supplied","built_in_this_workflow":false}'
          push-to-registry: false
          create-storage-record: false
