# Docker Compose for MCP Server
version: '3.8'

services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: code-index-mcp-server
    restart: unless-stopped
    volumes:
      # Source code for indexing
      - ./:/workspace:ro
      # Database persistence
      - ./code_index.db:/app/code_index.db
      - ./.mcp-index:/app/.mcp-index
      # Logs
      - ./logs:/app/logs
    environment:
      # Core settings
      - PYTHONPATH=/app
      - MCP_WORKSPACE_ROOT=/workspace
      - DATABASE_URL=sqlite:///./code_index.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
      # Semantic search (optional)
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
      - SEMANTIC_SEARCH_ENABLED=${SEMANTIC_SEARCH_ENABLED:-false}
      - SEMANTIC_EMBEDDING_MODEL=${SEMANTIC_EMBEDDING_MODEL:-voyage-code-3}
      # Server-mode Qdrant (with-vectors profile) requires an API key; clients fail closed without it.
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_REQUIRE_API_KEY=true
      
      # Reranking settings
      - RERANKING_ENABLED=${RERANKING_ENABLED:-true}
      - RERANKER_TYPE=${RERANKER_TYPE:-hybrid}
      
    stdin_open: true
    tty: true
    networks:
      - mcp-network

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    container_name: code-index-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - mcp-network
    profiles:
      - with-cache

  # Optional: Qdrant for vector search
  qdrant:
    # Pinned; upgrade deliberately, never via :latest.
    image: qdrant/qdrant:v1.17.0@sha256:f1c7272cdac52b38c1a0e89313922d940ba50afd90d593a1605dbbc214e66ffb
    container_name: code-index-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__TELEMETRY_DISABLED=true
      # Required. This file also serves users without vectors, so the key is not forced
      # at render time; the guard below refuses to start Qdrant when it is empty.
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
    # Fail closed: refuse to start the server without an API key.
    entrypoint:
      - /bin/bash
      - -c
      - 'if [ -z "$${QDRANT__SERVICE__API_KEY:-}" ]; then echo "QDRANT__SERVICE__API_KEY is empty; refusing to start Qdrant unauthenticated" >&2; exit 64; fi; exec "$$@"'
      - qdrant-auth-guard
    command: ["./entrypoint.sh"]
    networks:
      - mcp-network
    profiles:
      - with-vectors

networks:
  mcp-network:
    driver: bridge

volumes:
  redis-data:
  qdrant-data:
