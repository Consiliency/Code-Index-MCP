version: '3.8'

services:
  # Development container with Claude Code and all tools
  dev:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
      - "8001:8001"  # Additional port for development
    environment:
      # Database configuration
      - DATABASE_URL=sqlite:///app/data/code_index.db
      
      # Redis cache configuration
      - REDIS_URL=redis://redis:6379
      - CACHE_BACKEND=redis
      - CACHE_DEFAULT_TTL=3600
      
      # Development settings
      - LOG_LEVEL=DEBUG
      - PYTHONPATH=/app
      - NODE_ENV=development
      
      # Claude Code environment
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

      # Authenticated Qdrant (same value as the qdrant service key)
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY is required for the authenticated qdrant service}
      - QDRANT_REQUIRE_API_KEY=true
      
    volumes:
      # Mount source code for live development
      - .:/app
      # Mount your home code directory for indexing
      - ~/code:/code:ro
      # Persist data, logs, and test results
      - ./data:/app/data
      - ./logs:/app/logs
      - ./test_results:/app/test_results
    depends_on:
      - redis
      - qdrant
    stdin_open: true
    tty: true
    networks:
      - mcp-network
    command: /bin/bash

  # Redis cache service
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Qdrant vector database (for semantic search)
  qdrant:
    # Pinned; upgrade deliberately, never via :latest.
    image: qdrant/qdrant:v1.17.0@sha256:f1c7272cdac52b38c1a0e89313922d940ba50afd90d593a1605dbbc214e66ffb
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__TELEMETRY_DISABLED=true
      # Every API call except the /healthz, /livez and /readyz probes needs this key.
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY is required; Qdrant must not run unauthenticated}
    # Fail closed: refuse to start the server without an API key.
    entrypoint:
      - /bin/bash
      - -c
      - 'if [ -z "$${QDRANT__SERVICE__API_KEY:-}" ]; then echo "QDRANT__SERVICE__API_KEY is empty; refusing to start Qdrant unauthenticated" >&2; exit 64; fi; exec "$$@"'
      - qdrant-auth-guard
    command: ["./entrypoint.sh"]
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis-data:
  qdrant-data:

networks:
  mcp-network:
    driver: bridge